name: rescan

# Re-scans the SBOM already attached to the published image and rewrites
# docs/security-status.md. No rebuild and no image pull: the CycloneDX SBOM
# published with the release is the input, so this answers whether the current
# release is safe to run today. See docs/supply-chain.md.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/jaturu/omada-release-watch

jobs:
  scan-platform:
    name: rescan ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Derive platform slug
        run: echo "SLUG=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b  # v0.7
        with:
          version: v0.21.7

      - name: Install oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d  # v2.0.1
        with:
          version: 1.3.3

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v0.72.0

      - name: Pull the published SBOM for this platform
        run: |
          digest="$(crane digest --platform '${{ matrix.platform }}' "${IMAGE}:latest")"
          referrer="$(oras discover --format json "${IMAGE}@${digest}" \
            | jq -r '.referrers[]
                | select(.artifactType=="application/vnd.cyclonedx+json") | .digest')"
          case "$(printf '%s' "$referrer" | wc -w)" in
            1) ;;
            *) echo "expected one SBOM referrer, got: ${referrer}" >&2; exit 1;;
          esac
          oras pull -o . "${IMAGE}@${referrer}"
          echo "PLATFORM_DIGEST=${digest}" >> "$GITHUB_ENV"

      # Report only. A finding must reach the page rather than kill the run,
      # and the verdict step below is what turns a real one red.
      - name: Grype re-scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        with:
          sbom: sbom.cyclonedx.${{ env.SLUG }}.json
          config: .grype-ignore.yaml
          output-format: json
          output-file: grype-report.${{ env.SLUG }}.json
          severity-cutoff: high
          grype-version: v0.116.0
          fail-build: false
          cache-db: true

      - name: Trivy re-scan
        run: |
          trivy sbom --format json \
            --output "trivy-report.${SLUG}.json" \
            "sbom.cyclonedx.${SLUG}.json"

      - name: Record the platform digest
        run: |
          mkdir -p out
          echo "${SLUG}=${PLATFORM_DIGEST}" > "out/${SLUG}.platform"
          cp "sbom.cyclonedx.${SLUG}.json" "grype-report.${SLUG}.json" \
             "trivy-report.${SLUG}.json" out/

      - name: Upload re-scan reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rescan-${{ env.SLUG }}
          path: out/*
          if-no-files-found: error

  publish:
    name: rewrite the status page
    needs: [scan-platform]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b  # v0.7
        with:
          version: v0.21.7

      - name: Download re-scan reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/rescan
          pattern: rescan-*
          merge-multiple: true

      - name: Identify the current release
        run: |
          index="$(crane digest "${IMAGE}:latest")"
          tag="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          [ -n "$tag" ] || { echo "no release tag found" >&2; exit 1; }
          # latest and the newest tag must be the same image, or the page
          # would describe a release nobody is running.
          if [ "$(crane digest "${IMAGE}:${tag}")" != "$index" ]; then
            echo "${IMAGE}:latest is not ${tag}" >&2
            exit 1
          fi
          echo "INDEX=${index}" >> "$GITHUB_ENV"
          echo "TAG=${tag}" >> "$GITHUB_ENV"

      - name: Rewrite the status page
        run: |
          set --
          for f in /tmp/rescan/*.platform; do
            set -- "$@" --platform "$(cat "$f")"
          done
          expected="$(find /tmp/rescan -name '*.platform' | wc -l | tr -d ' ')"
          python3 -m scripts.rescan_status \
            --image "$IMAGE" --tag "$TAG" --index-digest "$INDEX" \
            --reports-dir /tmp/rescan "$@" \
            --expect-platforms "$expected" \
            --output docs/security-status.md

      - name: Commit the page when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/security-status.md; then
            echo "No change since the last re-scan."
            exit 0
          fi
          git add docs/security-status.md
          git commit -m "Update security status for ${TAG}"
          git push

      # Last, so the page is already committed when the run goes red.
      - name: Fail on a High or Critical finding
        run: |
          if grep -q '^Action needed' docs/security-status.md; then
            head -n3 docs/security-status.md >&2
            exit 1
          fi
          echo "No High or Critical findings against ${TAG}."
