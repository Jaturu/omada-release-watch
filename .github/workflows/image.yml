name: image

# Each arch builds natively, then merges into one manifest. A push to main
# scans, then (if gates pass) promotes, signs keyless, attaches SBOM and
# reports, and tags v<VERSION>-<build>.
# workflow_dispatch is a staging-only test (no promote).
on:
  push:
    branches: [main]
    # The crawler commits the catalog twice a day and the rescan workflow
    # commits the status page. Neither is in the image.
    paths-ignore: [catalog.sigstore.json, docs/security-status.md]
  workflow_dispatch: {}

# Least privilege at the top, widened only on the job that publishes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release mid-flight. Elsewhere the newest run wins.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: docker.io/jaturu/omada-release-watch
  GHCR_IMAGE: ghcr.io/jaturu/omada-release-watch

jobs:
  # Runs once per platform, on a runner of that architecture.
  build-platform:
    name: build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    # Builds and scans. Docker Hub is reached with its own credentials, so
    # nothing here needs the workflow token beyond reading the repository.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Derive platform slug
        run: |
          slug="${{ matrix.platform }}"
          echo "SLUG=${slug//\//-}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Docker Hub login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: true
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # Attestations make the pushed object a per-platform index. Everything
      # that addresses the image itself needs the manifest inside it.
      - name: Resolve image manifest digest
        run: |
          img="$(docker buildx imagetools inspect --raw \
            "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" \
            | jq -r '.manifests[]
                | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
                | .digest')"
          case "$(printf '%s' "$img" | wc -w)" in
            1) ;;
            *) echo "expected one image manifest, got: ${img}" >&2; exit 1;;
          esac
          echo "IMAGE_DIGEST=${img}" >> "$GITHUB_ENV"
          echo "Index pushed:   ${{ steps.build.outputs.digest }}"
          echo "Image manifest: ${img}"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v0.72.0

      - name: Trivy cache key (daily)
        id: tcache
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.arch }}-${{ steps.tcache.outputs.day }}
          restore-keys: trivy-db-${{ runner.arch }}-

      # --- SBOM (Syft), scanned natively on this arch ---

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ env.IMAGE_DIGEST }}
          format: cyclonedx-json@1.5
          output-file: sbom.cyclonedx.${{ env.SLUG }}.json
          syft-version: v1.49.0
          upload-artifact: false
          upload-release-assets: false

      - name: Display SBOM summary
        run: |
          echo "Components: $(jq '.components | length' "sbom.cyclonedx.${SLUG}.json")"
          jq -r '.components[] | "\(.name) \(.version)"' "sbom.cyclonedx.${SLUG}.json" | sort

      # --- Vulnerability scans (Grype + Trivy) ---

      # Report and gate in one pass: ignored findings stay in the
      # report under ignoredMatches, tagged with the rule that hid them.
      - name: Grype vulnerability scan (report and gate)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        with:
          sbom: sbom.cyclonedx.${{ env.SLUG }}.json
          config: .grype-ignore.yaml
          output-format: json
          output-file: grype-report.${{ env.SLUG }}.json
          severity-cutoff: high
          grype-version: v0.116.0
          fail-build: true
          cache-db: true

      - name: Trivy image scan (full report)
        run: |
          trivy image --format json --output "trivy-report.${SLUG}.json" \
            "${{ env.IMAGE }}@${IMAGE_DIGEST}"
          echo "Trivy report written to trivy-report.${SLUG}.json"

      - name: Trivy image scan (blocking gate)
        run: |
          trivy image --format table --severity HIGH,CRITICAL --exit-code 1 \
            "${{ env.IMAGE }}@${IMAGE_DIGEST}"

      # --- Attach to this platform's digest, where tooling looks ---

      - name: Install oras
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d  # v2.0.1
        with:
          version: 1.3.3

      - name: Attach SBOM and scan reports
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          oras attach --artifact-type application/vnd.cyclonedx+json \
            "${{ env.IMAGE }}@${IMAGE_DIGEST}" \
            "sbom.cyclonedx.${SLUG}.json:application/vnd.cyclonedx+json"
          oras attach --artifact-type application/vnd.security.vulnerability-report+json \
            "${{ env.IMAGE }}@${IMAGE_DIGEST}" \
            "grype-report.${SLUG}.json:application/vnd.security.vulnerability-report+json" \
            "trivy-report.${SLUG}.json:application/vnd.security.vulnerability-report+json"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digests-${{ env.SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      # always(): a failed gate must still leave its report to inspect.
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: reports-${{ env.SLUG }}
          path: |
            sbom.cyclonedx.${{ env.SLUG }}.json
            grype-report.${{ env.SLUG }}.json
            trivy-report.${{ env.SLUG }}.json
          if-no-files-found: warn
          retention-days: 1

  # Runs once, after every platform. Assembles the manifest and ships it.
  publish:
    name: assemble and publish
    needs: [build-platform]
    runs-on: ubuntu-latest

    # contents to push the release tag, id-token for keyless signing, and
    # packages for the GHCR mirror.
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute release tag (v<VERSION>-<build>)
        id: rel
        run: |
          version="$(head -n1 VERSION | tr -d '[:space:]')"
          [ -n "$version" ] || { echo "VERSION file is empty" >&2; exit 1; }
          git fetch --tags --force >/dev/null 2>&1 || true
          num=1
          for t in $(git tag -l "v${version}-*"); do
            suffix="${t#v${version}-}"
            case "$suffix" in ''|*[!0-9]*) continue;; esac
            [ "$suffix" -ge "$num" ] && num=$((suffix + 1))
          done
          tag="v${version}-${num}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Computed release tag: ${tag}"

      - name: Log the pipeline mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Main push: merge scanned digests, promote, sign, attach, and tag ${{ steps.rel.outputs.tag }}"
          else
            echo "Dispatch: merge scanned digests into the staging tag. No promotion."
          fi

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Download scan reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/reports
          pattern: reports-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Docker Hub login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: GHCR login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract staging metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha

      - name: Merge per-platform digests into staging manifest
        id: manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          digest="$(docker buildx imagetools inspect \
            '${{ env.IMAGE }}:${{ steps.meta.outputs.version }}' \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Manifest digest: ${digest}"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v0.72.0

      - name: Trivy cache key (daily)
        id: tcache
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.arch }}-${{ steps.tcache.outputs.day }}
          restore-keys: trivy-db-${{ runner.arch }}-

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b  # v0.7
        with:
          version: v0.21.7

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Trivy source scan (secrets and misconfig)
        run: trivy fs --scanners secret,misconfig --severity HIGH,CRITICAL --exit-code 1 .

      # Digest-scoped work runs first. Nothing below publishes a tag, so a
      # failure here leaves no release behind and the run is safe to retry.

      # --- Keyless signing (Cosign, bound to this workflow's OIDC identity) ---

      - name: Sign image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cosign sign --yes --recursive ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}

      # cosign 3 signs to an OCI referrer the registry needs a moment to serve.
      - name: Verify image signature
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 3
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          sleep 5
          until cosign verify \
            --certificate-identity-regexp 'https://github.com/${{ github.repository }}/\.github/workflows/.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}; do
            sleep 5
          done

      # --- Publishing starts here. Everything below writes a tag. ---

      # The build number comes from git tags, so claim it before publishing
      # anything. A failure after this leaves a tag with no image, which is
      # inert. Claiming it afterwards instead lets a failure strand a
      # published image with no tag, and every retry then recomputes the same
      # number and is refused, which blocks all further releases.
      - name: Claim the release number
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Promote staging digest to release tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          # Release tags are immutable. A rate limit, a 5xx or a DNS failure
          # must not read as "the tag is free", so only a genuine not-found
          # counts as absent.
          if err="$(crane digest "${{ env.IMAGE }}:${TAG}" 2>&1 >/dev/null)"; then
            echo "Release tag ${TAG} already exists on the registry; refusing to overwrite." >&2
            exit 1
          elif ! printf '%s' "$err" | grep -qiE 'MANIFEST_UNKNOWN|NAME_UNKNOWN|not found|404'; then
            echo "Could not establish whether ${TAG} exists: ${err}" >&2
            exit 1
          fi
          crane tag ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }} "${TAG}"
          crane tag ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }} latest

      # --- Mirror to GHCR (Docker Hub stays the canonical record) ---

      - name: Mirror release to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          crane copy ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }} ${{ env.GHCR_IMAGE }}:${{ steps.rel.outputs.tag }}
          crane tag ${{ env.GHCR_IMAGE }}@${{ steps.manifest.outputs.digest }} latest

      # --recursive matches the Docker Hub signature. Automation resolves a
      # platform digest, and a signature on the index alone is invisible to it,
      # so an admission controller pointed at the mirror rejects every image.
      - name: Sign GHCR mirror
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cosign sign --yes --recursive ${{ env.GHCR_IMAGE }}@${{ steps.manifest.outputs.digest }}

      # The readable copy of what the gates saw. Run artifacts expire in a day.
      # Non-blocking: the release is already promoted and signed by here, and
      # the tag number is claimed, so a retry would build a different release.
      - name: Publish the release report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
          INDEX: ${{ steps.manifest.outputs.digest }}
        run: |
          # Platforms come from the reports actually downloaded, so this stays
          # in step with the build matrix.
          set --
          for f in /tmp/reports/sbom.cyclonedx.*.json; do
            slug="$(basename "$f" .json)"; slug="${slug#sbom.cyclonedx.}"
            digest="$(crane digest --platform "${slug/-//}" "${{ env.IMAGE }}@${INDEX}")"
            set -- "$@" --platform "${slug}=${digest}"
          done
          # digests-* uploads with if-no-files-found: error, so its count is
          # the number of platforms that actually built.
          expected="$(find /tmp/digests -type f | wc -l | tr -d ' ')"
          python3 -m scripts.render_release_report \
            --tag "$TAG" --index-digest "$INDEX" \
            --reports-dir /tmp/reports "$@" \
            --expect-platforms "$expected" \
            --output /tmp/release-body.md
          gh release create "$TAG" --title "$TAG" \
            --notes-file /tmp/release-body.md /tmp/reports/*.json
